<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1B20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KoKrŠNeK">
<title>KoKrŠNeK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="themes.css">
<script>
// Styl vzhledu hned při startu, ať obrazovka neprobliká v jiných barvách.
(function(){var t=null;try{t=localStorage.getItem('kokrsnek2Theme')}catch(e){}
// Všechny vzhledy (vygenerováno z theme.js — při přidání vzhledu doplnit).
var F={"puvodni":"family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700","chata":"family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700","festival":"family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700","hlidka":"family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700","taborak":"family=Bitter:wght@700;800&family=Source+Sans+3:wght@400;500;600;700&family=Anton","zapisnik":"family=Comic+Relief:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400","znaceni":"family=Fira+Sans+Condensed:wght@500;600;700;800&family=Fira+Sans:wght@400;500;600;700","neon":"family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700","komiks":"family=Bangers&family=Comic+Neue:wght@400;700","vodaci":"family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700","western":"family=Rye&family=Bitter:wght@700;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400"};
var S={"puvodni":"#1C1B20","chata":"#2F5D46","festival":"#0D0D10","hlidka":"#1D2B4F","taborak":"#140E0A","zapisnik":"#FBF5E6","znaceni":"#E9E6DC","neon":"#070B18","komiks":"#FFF6D9","vodaci":"#E3F3F6","western":"#D9BC85"};
if(!F[t])t='puvodni';
if(t!=='puvodni')document.documentElement.setAttribute('data-theme',t);
var m=null;try{m=localStorage.getItem('kokrsnek2Mode')}catch(e){}
var lt=t==='puvodni'&&(m==='light'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches));
if(lt)document.documentElement.setAttribute('data-mode','light');
document.querySelector('meta[name="theme-color"]').setAttribute('content',lt?'#2F7A56':S[t]);
document.write('<link id="font-'+t+'" rel="stylesheet" href="https://fonts.googleapis.com/css2?'+F[t]+'&display=swap">');})();
</script>
</head>
<body>
<div id="app"><div class="spin" aria-label="Načítám"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
